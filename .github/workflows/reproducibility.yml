name: Reproducibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  numerical:
    name: Numerical audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install the pinned environment
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Check environment consistency
        run: python -m pip check
      - name: Run the public example
        run: python tools/manage.py demo
      - name: Verify the artifact and interface
        run: python tools/manage.py verify
      - name: Reconstruct and compare the V4 additions
        run: python tools/manage.py reproduce
      - name: Confirm the checkout was not changed
        run: git diff --exit-code

  manuscript:
    name: Six-page PDF (TeX Live)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Install the TeX Live build dependencies
        run: |
          # The hosted runner's Azure mirror can stall on large TeX packages.
          # Use the canonical Ubuntu archive; package signature checks remain enabled.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends texlive-latex-recommended lmodern
      - name: Build and check the PDF in an isolated copy
        run: python tools/manage.py build
      - name: Confirm the checkout was not changed
        run: git diff --exit-code
